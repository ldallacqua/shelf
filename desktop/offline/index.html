<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <!-- The window has no Windows bar: the page moves it, and has its own minimize and close. -->
  <body data-tauri-drag-region="deep">
    <div class="controls">
      <button id="minimize" type="button" aria-label="Minimize">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" /></svg>
      </button>
      <button id="close" class="close" type="button" aria-label="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" /></svg>
      </button>
    </div>
    <main>
      <p id="opening" class="quiet">Opening Shelf…</p>
      <section id="unreachable" hidden>
        <h1 id="title">Shelf can't be reached</h1>
        <p id="why" class="quiet">Check the internet connection, then try again.</p>
        <button id="again" type="button">Try again</button>
      </section>
    </main>
  </body>
</html>
