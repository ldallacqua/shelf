<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <!-- The splash has no bar: any part of it moves the window. -->
  <body data-tauri-drag-region="deep">
    <main>
      <!-- Shelf's icon, as the installer and Windows show it (src/app/icon.svg). -->
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="tile-ground" x2="0" y2="1">
            <stop offset="0" stop-color="#181b26" />
            <stop offset="1" stop-color="#0b0d12" />
          </linearGradient>
          <radialGradient id="tile-glow" cx="0.5" cy="0.8" r="0.55">
            <stop offset="0" stop-color="#7c5cff" stop-opacity="0.32" />
            <stop offset="1" stop-color="#7c5cff" stop-opacity="0" />
          </radialGradient>
        </defs>
        <rect width="32" height="32" rx="7" fill="url(#tile-ground)" />
        <rect width="32" height="32" rx="7" fill="url(#tile-glow)" />
        <rect
          x="0.25"
          y="0.25"
          width="31.5"
          height="31.5"
          rx="6.75"
          fill="none"
          stroke="#fff"
          stroke-opacity="0.08"
          stroke-width="0.5"
        />
        <path
          fill="#f2f4f8"
          d="M26 4H13.5A7.5 7.5 0 0 0 6 11.5V13.5H11V11.5A2.5 2.5 0 0 1 13.5 9H26ZM6 28H18.5A7.5 7.5 0 0 0 26 20.5V18.5H21V20.5A2.5 2.5 0 0 1 18.5 23H6Z"
        />
        <path fill="#7c5cff" d="M6 13.5H23.5A2.5 2.5 0 0 1 26 16V18.5H8.5A2.5 2.5 0 0 1 6 16Z" />
      </svg>
      <div id="working" class="working">
        <p id="status" class="status" role="status">Opening Shelf</p>
        <div id="bar" class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div>
      </div>
      <section id="unreachable" class="unreachable" hidden>
        <h1 id="title">Shelf can't be reached</h1>
        <p id="why">Check the internet connection, then try again.</p>
        <div class="actions">
          <button id="again" type="button">Try again</button>
          <button id="close" class="quiet" type="button">Close</button>
        </div>
      </section>
    </main>
  </body>
</html>
