name: Build
description: Builds the app, reusing Next.js's cache from earlier runs.
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'messages/**', 'next.config.ts') }}
        restore-keys: |
          next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
    - name: Build
      shell: bash
      run: pnpm build
