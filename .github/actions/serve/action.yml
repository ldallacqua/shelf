name: Serve
description: Starts the built app on port 3300 and waits until it answers.
runs:
  using: composite
  steps:
    - name: Start the server
      shell: bash
      run: |
        pnpm start > server.log 2>&1 &
        for attempt in $(seq 1 60); do
          if curl --silent --fail --output /dev/null http://localhost:3300/en; then
            echo "The server answered after ${attempt}s."
            exit 0
          fi
          sleep 1
        done
        echo "The server did not answer within 60s."
        cat server.log
        exit 1
