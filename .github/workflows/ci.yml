name: CI

# The gate (the owner's rule, 22 Nov 2026). Every pull request into main runs
# this, and main is protected: it takes pull requests only, and only once the
# Gate job below passes. Pull requests merge themselves when it does
# (auto-merge). The repository is public, so Actions minutes cost nothing.
#
#   What changed  which of the jobs below this change needs
#   Checks        format, lint, types, translations, unit and component tests
#   Build         the sample database, a production build, the JavaScript
#                 budgets, Lighthouse (mobile profile)
#   Storybook     the Storybook build
#   Desktop       the desktop app's Rust tests, on Windows
#   Gate          passes when every job above passed or was skipped; the one
#                 check main's protection names
#
# What does not run, and why:
#   - The browser tests (Playwright) are too slow for every pull request for
#     now (the owner's rule, 22 Nov 2026). By hand: Actions → CI → Run
#     workflow, with "browsers" ticked.
#   - A change to docs/ or to Markdown files alone skips Build and Storybook:
#     nothing they check changed. Checks still runs (the format check reads
#     Markdown, and two unit tests read docs/spec.md).
#   - Desktop runs only when desktop/ changed.
#   - A change to this workflow or its actions runs every job.
#   - pnpm verify's Linux pass in Docker held browser tests only, and this
#     runner is Linux already. The 3D frame time needs a graphics card.
#
# Runs on main too, after each merge: a pull request's run can read caches
# made on main but not another pull request's, so main's runs keep pnpm's,
# Next.js's and Playwright's caches warm for the next pull request.
#
# No job needs a secret: everything runs against a local build, a SQLite file
# seeded from the fixtures, and test doubles for IGDB.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: Also run the browser tests, three engines at three widths
        type: boolean
        default: false
      screenshots:
        description: Only make new reference screenshots, offered as a download
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces its older run; main's runs all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  changes:
    name: What changed
    if: ${{ !inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      desktop: ${{ steps.diff.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Read the changed files
        id: diff
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request's run checks out the merge of the branch into main,
          # whose first parent is main: the difference is what the branch changes.
          case "$GITHUB_EVENT_NAME" in
            pull_request) files=$(git diff --name-only HEAD^1 HEAD) || files=ALL ;;
            push) files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null) || files=ALL ;;
            *) files=ALL ;;
          esac
          if [ "$files" = ALL ] || grep -q '^\.github/' <<< "$files"; then
            app=true
            desktop=true
          else
            app=false
            desktop=false
            grep -qvE '^(docs|desktop)/|^[^/]+\.md$' <<< "$files" && app=true
            grep -q '^desktop/' <<< "$files" && desktop=true
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          printf 'Changed:\n%s\n\nBuild and Storybook: %s. Desktop: %s.\n' "$files" "$app" "$desktop"

  checks:
    name: Checks
    if: ${{ !inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Translations
        run: pnpm i18n:check
      - name: Unit and component tests
        run: pnpm test

  build:
    name: Build, budgets and Lighthouse
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium

      - uses: ./.github/actions/serve
      - name: JavaScript budgets
        run: pnpm perf:js
      - name: Lighthouse, mobile profile
        run: pnpm perf:lighthouse
        env:
          # Lighthouse's stock slowdown. The script would work one out from
          # the machine's benchmark, but that times a single core, and this
          # runner's are shared by the server, the browser and Lighthouse:
          # the benchmark says 8 times, which measured twice as slow as the
          # phone the targets are for. And runners come in more than one
          # speed, so the 4 times are for a runner of benchmark 3500 and a
          # slower one is slowed less, in proportion. See scripts/lib/budgets.ts.
          LIGHTHOUSE_SLOWDOWN: 4
          LIGHTHOUSE_SLOWDOWN_AT: 3500

      - name: The server's log
        if: failure()
        run: cat server.log
      - name: Lighthouse's reports of the pages that missed
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-reports
          path: .data/lighthouse/
          if-no-files-found: ignore
          retention-days: 7

  storybook:
    name: Storybook
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Storybook builds
        run: pnpm storybook:build --quiet

  desktop:
    name: Desktop
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    # Shelf for Windows (ADR 005): its Rust side, tested where it runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: The Rust side's tests
        run: cargo test --manifest-path desktop/Cargo.toml --locked

  browsers:
    name: Browser tests · ${{ matrix.browser }}
    needs: changes
    # By hand only, for now: too slow for every pull request.
    if: ${{ inputs.browsers }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browser }}

      - uses: ./.github/actions/serve
      - name: End-to-end tests at phone, tablet and desktop width
        run: >-
          pnpm e2e
          --project=${{ matrix.browser }}-phone
          --project=${{ matrix.browser }}-tablet
          --project=${{ matrix.browser }}-desktop
        env:
          BASE_URL: http://localhost:3300

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gate:
    name: Gate
    # Runs when a job it waits for failed too, so a failure fails the gate
    # instead of leaving it unreported. A cancelled run (replaced by a newer
    # push) reports nothing; the newer run does.
    if: ${{ !cancelled() && !inputs.screenshots }}
    needs: [changes, checks, build, storybook, desktop, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A job did not pass."; exit 1 ;;
            esac
          done

  screenshots:
    name: Reference screenshots
    # Makes new reference screenshots and offers them as a download. It never
    # commits: on Vercel's free plan a commit by a bot would not deploy.
    if: ${{ inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium

      - uses: ./.github/actions/serve
      - name: Make the screenshots
        run: >-
          pnpm e2e e2e/visual.spec.ts
          --project=chromium-phone --project=chromium-desktop
          --update-snapshots
        env:
          BASE_URL: http://localhost:3300

      - uses: actions/upload-artifact@v7
        with:
          name: reference-screenshots
          path: e2e/__screenshots__/
          retention-days: 7
