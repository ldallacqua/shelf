name: CI

# Run by hand only: Actions → CI → Run workflow. Nothing here runs on a push
# or a pull request. Actions minutes on a private repository are limited, and
# the full set of checks took about 75 of the month's 2,000 each time, so
# every check runs on the Mac before a push instead: `pnpm verify`
# (docs/testing.md). This stays for the odd time a check is wanted on
# GitHub's own Linux machines.
#
#   everything   format, lint, types, translations, unit and component tests,
#                build, JavaScript budgets, the @smoke browser tests; then all
#                nine browser projects, reference screenshots, Lighthouse and
#                Storybook
#   lighthouse   Lighthouse and the Storybook build only
#   screenshots  ticked: new reference screenshots, offered as a download
#
# No job needs a secret: everything runs against a local build, a SQLite file
# seeded from the fixtures, and test doubles for IGDB.

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Make new reference screenshots instead of comparing
        type: boolean
        default: false
      only:
        description: Run one part of the checks
        type: choice
        options: [everything, lighthouse]
        default: everything

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  quick:
    name: Quick checks
    if: ${{ !inputs.screenshots && inputs.only == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Translations
        run: pnpm i18n:check
      - name: Unit and component tests
        run: pnpm test

      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium

      - uses: ./.github/actions/serve
      - name: JavaScript budgets
        run: pnpm perf:js
      - name: End-to-end smoke tests
        run: pnpm e2e --project=chromium-phone --project=chromium-desktop --grep @smoke --grep-invert @visual
        env:
          BASE_URL: http://localhost:3300

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: quick-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  full:
    name: Full · ${{ matrix.browser }}
    if: ${{ !inputs.screenshots && inputs.only == 'everything' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: ${{ matrix.browser }}

      - uses: ./.github/actions/serve
      - name: End-to-end tests at phone, tablet and desktop width
        run: >-
          pnpm e2e
          --project=${{ matrix.browser }}-phone
          --project=${{ matrix.browser }}-tablet
          --project=${{ matrix.browser }}-desktop
        env:
          BASE_URL: http://localhost:3300

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: full-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  speed:
    name: Full · Lighthouse and Storybook
    if: ${{ !inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium

      - uses: ./.github/actions/serve
      - name: Lighthouse, mobile profile
        run: pnpm perf:lighthouse
        env:
          # Lighthouse's stock slowdown. The script would work one out from
          # the machine's benchmark, but that times a single core, and this
          # runner's two are shared by the server, the browser and Lighthouse:
          # the benchmark says 8 times, which measured twice as slow as the
          # phone the targets are for. See scripts/lib/budgets.ts.
          LIGHTHOUSE_SLOWDOWN: 4
      - name: Storybook builds
        run: pnpm storybook:build --quiet

  screenshots:
    name: Reference screenshots
    # Makes new reference screenshots and offers them as a download. It never
    # commits: on Vercel's free plan a commit by a bot would not deploy.
    if: ${{ inputs.screenshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium

      - uses: ./.github/actions/serve
      - name: Make the screenshots
        run: >-
          pnpm e2e e2e/visual.spec.ts
          --project=chromium-phone --project=chromium-desktop
          --update-snapshots
        env:
          BASE_URL: http://localhost:3300

      - uses: actions/upload-artifact@v7
        with:
          name: reference-screenshots
          path: e2e/__screenshots__/
          retention-days: 7
